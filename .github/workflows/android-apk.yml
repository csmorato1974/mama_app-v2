name: Generar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar dependencias web
        run: npm install --no-audit --no-fund

      - name: Instalar Capacitor para la compilación
        run: npm install --no-save @capacitor/core@8.4.2 @capacitor/android@8.4.2 @capacitor/cli@8.4.2

      - name: Preparar contenedor web
        run: |
          mkdir -p android-web
          printf '%s\n' '<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body></body></html>' > android-web/index.html

      - name: Crear proyecto Android
        env:
          CAPACITOR_SERVER_URL: https://renal-app.lovable.app
        run: npx cap add android

      - name: Sincronizar aplicación web con Android
        env:
          CAPACITOR_SERVER_URL: https://preview--renal-app.lovable.app
        run: npx cap sync android

      - name: Generar APK de prueba
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: centro-de-cuidados-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
